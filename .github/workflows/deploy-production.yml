name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riskhrms-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Backup, pull, build, migrate, and verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Configure production SSH access
        shell: bash
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "${PROD_SSH_KEY}"
          test -n "${PROD_KNOWN_HOSTS}"
          install -d -m 0700 "${HOME}/.ssh"
          printf '%s\n' "${PROD_SSH_KEY}" > "${HOME}/.ssh/id_riskhrms_deploy"
          printf '%s\n' "${PROD_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 0600 "${HOME}/.ssh/id_riskhrms_deploy" "${HOME}/.ssh/known_hosts"

      - name: Deploy approved main commit
        shell: bash
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          set -Eeuo pipefail
          test -n "${PROD_HOST}"
          test -n "${PROD_USER}"
          port="${PROD_PORT:-22}"
          ssh \
            -i "${HOME}/.ssh/id_riskhrms_deploy" \
            -p "${port}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "${PROD_USER}@${PROD_HOST}" \
            'sudo -n bash /opt/riskhrms/deploy/ubuntu/update-hrms.sh'
